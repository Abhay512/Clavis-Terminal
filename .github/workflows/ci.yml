name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Engine smoke test
        run: python -m tests.test_oneway

      - name: Import the live entrypoints
        run: python -c "import main, replay, api"

  dashboard:
    name: Dashboard · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20"]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  containers:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: |
          touch backend/.env
          docker compose config --quiet

      - name: Build the backend image
        run: docker build -t clavis-backend:ci ./backend

      - name: Build the dashboard image
        run: docker build -t clavis-dashboard:ci ./dashboard

  secrets:
    name: No credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a real .env or key-shaped string was committed
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local|\.production)?$'; then
            echo "::error::a .env file is tracked - remove it and rotate the key"
            exit 1
          fi
          if git grep -nIE '(api_key|api_secret|access_token)[[:space:]]*[=:][[:space:]]*["'"'"'][A-Za-z0-9]{6,}' -- . ; then
            echo "::error::a hard-coded credential was found"
            exit 1
          fi
          echo "clean"
