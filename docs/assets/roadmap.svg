<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Inter,'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="rh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4af6c3"/><stop offset="0.5" stop-color="#6db3f2"/><stop offset="1" stop-color="#b592f6"/></linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fe0b0"/><stop offset="1" stop-color="#1b7d63"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a9dff"/><stop offset="1" stop-color="#2e5896"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a97bf6"/><stop offset="1" stop-color="#5f3f96"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa028"/><stop offset="1" stop-color="#a3610f"/></linearGradient>
    <style>
      .bg{fill:#0b0d10}
      .t{fill:#e9ecf1}.f{fill:#6d7785}
      .card{fill:#12151c;stroke:#232a36;stroke-width:1}
      .n{font-size:13.5px;font-weight:700}
      .s{font-size:11px}
      .xs{font-size:9.5px;letter-spacing:1.6px}
      .cap{font-size:16px;font-weight:800}
    </style>
  </defs>
  <rect class="bg" width="1240" height="760"/>

  <text x="40" y="46" font-size="24" font-weight="800" fill="url(#rh)">Roadmap</text>
  <text x="40" y="68" class="f s">four tracks, ordered by what unblocks the most downstream value</text>

  <!-- spine -->
  <line x1="40" y1="112" x2="1200" y2="112" stroke="#232a36" stroke-width="2"/>
  <circle cx="188" cy="112" r="6" fill="#2fe0b0"/><circle cx="484" cy="112" r="6" fill="#5a9dff"/>
  <circle cx="780" cy="112" r="6" fill="#a97bf6"/><circle cx="1076" cy="112" r="6" fill="#ffa028"/>

  <!-- COLUMN 1 -->
  <rect x="40" y="136" width="272" height="34" rx="6" fill="url(#c1)"/>
  <text x="58" y="152" class="xs" fill="#06231b">TRACK 01 · SHIPPED</text>
  <text x="58" y="165" fill="#06231b" font-size="12.5" font-weight="700">The live platform</text>

  <g>
    <rect class="card" x="40" y="180" width="272" height="72" rx="8"/>
    <text x="58" y="204" class="t n">Full-chain ingestion</text>
    <text x="58" y="223" class="f s">~8,800 contracts under the</text>
    <text x="58" y="239" class="f s">broker's 3-socket ceiling</text>

    <rect class="card" x="40" y="260" width="272" height="72" rx="8"/>
    <text x="58" y="284" class="t n">Four-way flow engine</text>
    <text x="58" y="303" class="f s">buying, writing, covering and</text>
    <text x="58" y="319" class="f s">unwinding, roll-netted</text>

    <rect class="card" x="40" y="340" width="272" height="72" rx="8"/>
    <text x="58" y="364" class="t n">Conviction funnel</text>
    <text x="58" y="383" class="f s">probes, four promotion legs,</text>
    <text x="58" y="399" class="f s">regime-scaled risk</text>

    <rect class="card" x="40" y="420" width="272" height="72" rx="8"/>
    <text x="58" y="444" class="t n">Survivability layer</text>
    <text x="58" y="463" class="f s">watchdog, gap backfill, warm</text>
    <text x="58" y="479" class="f s">restart, crash-safe writes</text>

    <rect class="card" x="40" y="500" width="272" height="72" rx="8"/>
    <text x="58" y="524" class="t n">Replay harness</text>
    <text x="58" y="543" class="f s">any recorded day, through the</text>
    <text x="58" y="559" class="f s">exact same engine objects</text>
  </g>

  <!-- COLUMN 2 -->
  <rect x="336" y="136" width="272" height="34" rx="6" fill="url(#c2)"/>
  <text x="354" y="152" class="xs" fill="#061021">TRACK 02 · NEAR TERM</text>
  <text x="354" y="165" fill="#061021" font-size="12.5" font-weight="700">Widen the net</text>

  <g>
    <rect class="card" x="336" y="180" width="272" height="72" rx="8"/>
    <text x="354" y="204" class="t n">Broader entry coverage</text>
    <text x="354" y="223" class="f s">admit more of the day's real</text>
    <text x="354" y="239" class="f s">movers without buying tops</text>

    <rect class="card" x="336" y="260" width="272" height="72" rx="8"/>
    <text x="354" y="284" class="t n">Opening-window regime</text>
    <text x="354" y="303" class="f s">gap-hold breadth, dispersion,</text>
    <text x="354" y="319" class="f s">sector concentration by 09:45</text>

    <rect class="card" x="336" y="340" width="272" height="72" rx="8"/>
    <text x="354" y="364" class="t n">Direction-aware regime</text>
    <text x="354" y="383" class="f s">read trend side, not only</text>
    <text x="354" y="399" class="f s">trend strength</text>

    <rect class="card" x="336" y="420" width="272" height="72" rx="8"/>
    <text x="354" y="444" class="t n">Unwind-flow framework</text>
    <text x="354" y="463" class="f s">treat trapped-writer covering</text>
    <text x="354" y="479" class="f s">as a first-class signal</text>

    <rect class="card" x="336" y="500" width="272" height="72" rx="8"/>
    <text x="354" y="524" class="t n">Paper execution log</text>
    <text x="354" y="543" class="f s">exact contract, stop and exit,</text>
    <text x="354" y="559" class="f s">so slippage is measured</text>
  </g>

  <!-- COLUMN 3 -->
  <rect x="632" y="136" width="272" height="34" rx="6" fill="url(#c3)"/>
  <text x="650" y="152" class="xs" fill="#150a26">TRACK 03 · MEDIUM TERM</text>
  <text x="650" y="165" fill="#150a26" font-size="12.5" font-weight="700">Learn from the archive</text>

  <g>
    <rect class="card" x="632" y="180" width="272" height="72" rx="8"/>
    <text x="650" y="204" class="t n">Supervised advisor</text>
    <text x="650" y="223" class="f s">gradient-boosted trees over</text>
    <text x="650" y="239" class="f s">recorded per-minute metrics</text>

    <rect class="card" x="632" y="260" width="272" height="72" rx="8"/>
    <text x="650" y="284" class="t n">Walk-forward gating</text>
    <text x="650" y="303" class="f s">no in-sample tuning; the model</text>
    <text x="650" y="319" class="f s">advises over explicit rules</text>

    <rect class="card" x="632" y="340" width="272" height="72" rx="8"/>
    <text x="650" y="364" class="t n">Regime classifier</text>
    <text x="650" y="383" class="f s">trained across sessions rather</text>
    <text x="650" y="399" class="f s">than read live off one tape</text>

    <rect class="card" x="632" y="420" width="272" height="72" rx="8"/>
    <text x="650" y="444" class="t n">Automated day audit</text>
    <text x="650" y="463" class="f s">what fired, what returned, which</text>
    <text x="650" y="479" class="f s">gate rejected each real mover</text>

    <rect class="card" x="632" y="500" width="272" height="72" rx="8"/>
    <text x="650" y="524" class="t n">Feature store</text>
    <text x="650" y="543" class="f s">versioned, replay-reproducible,</text>
    <text x="650" y="559" class="f s">leak-free by construction</text>
  </g>

  <!-- COLUMN 4 -->
  <rect x="928" y="136" width="272" height="34" rx="6" fill="url(#c4)"/>
  <text x="946" y="152" class="xs" fill="#241300">TRACK 04 · PLATFORM</text>
  <text x="946" y="165" fill="#241300" font-size="12.5" font-weight="700">Scale it out</text>

  <g>
    <rect class="card" x="928" y="180" width="272" height="72" rx="8"/>
    <text x="946" y="204" class="t n">Split the process</text>
    <text x="946" y="223" class="f s">promote the bus to Redis Streams</text>
    <text x="946" y="239" class="f s">or NATS; independent services</text>

    <rect class="card" x="928" y="260" width="272" height="72" rx="8"/>
    <text x="946" y="284" class="t n">Columnar time series</text>
    <text x="946" y="303" class="f s">ClickHouse or TimescaleDB for</text>
    <text x="946" y="319" class="f s">interactive cross-session queries</text>

    <rect class="card" x="928" y="340" width="272" height="72" rx="8"/>
    <text x="946" y="364" class="t n">Shard the universe</text>
    <text x="946" y="383" class="f s">multiple keyed workers lift the</text>
    <text x="946" y="399" class="f s">instrument ceiling; add indices</text>

    <rect class="card" x="928" y="420" width="272" height="72" rx="8"/>
    <text x="946" y="444" class="t n">Containerised deploy</text>
    <text x="946" y="463" class="f s">Compose stack plus a pre-market</text>
    <text x="946" y="479" class="f s">auth and health job</text>

    <rect class="card" x="928" y="500" width="272" height="72" rx="8"/>
    <text x="946" y="524" class="t n">Broker-agnostic feed</text>
    <text x="946" y="543" class="f s">one adapter interface behind</text>
    <text x="946" y="559" class="f s">feed/, plus a simulated source</text>
  </g>

  <!-- principle strip -->
  <rect x="40" y="602" width="1160" height="120" rx="10" fill="#12151c" stroke="#232a36"/>
  <rect x="40" y="602" width="5" height="120" rx="2.5" fill="url(#rh)"/>
  <text x="64" y="630" class="xs" fill="#7fe6cd">THE CONSTRAINT THAT ORDERS ALL FOUR TRACKS</text>
  <text x="64" y="660" class="t" font-size="15" font-weight="600">Nothing ships that cannot be explained on screen, reproduced from a recording, and falsified on a session it was never fitted to.</text>
  <text x="64" y="688" class="f s">Learned components are welcome inside that boundary and are planned as an advisory layer above the rule gates — the archive of per-minute metrics already exists</text>
  <text x="64" y="706" class="f s">to train them. What is not welcome is a signal whose reasoning cannot be read off the board at the moment it fires.</text>
</svg>
